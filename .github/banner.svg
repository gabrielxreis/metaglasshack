<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E1326"/>
      <stop offset="1" stop-color="#05060F"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.26" cy="0.2" r="0.6">
      <stop offset="0" stop-color="#5B86FF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5B86FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5B86FF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7896FF" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="28" fill="url(#grid)"/>
  <rect width="1280" height="320" rx="28" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="1279" height="319" rx="27.5" fill="none" stroke="#7896FF" stroke-opacity="0.18"/>

  <!-- óculos -->
  <g transform="translate(120 104)" filter="url(#glow)" fill="none" stroke="url(#grad)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M10 22 C10 6 26 0 52 0 H92 C112 0 120 10 116 34 C112 62 98 82 70 82 C42 82 22 68 14 48 Z"/>
    <path d="M250 22 C250 6 234 0 208 0 H168 C148 0 140 10 144 34 C148 62 162 82 190 82 C218 82 238 68 246 48 Z"/>
    <path d="M118 18 C124 10 136 10 142 18"/>
  </g>
  <!-- ondas bluetooth -->
  <g transform="translate(396 112)" fill="none" stroke="#8CF233" stroke-width="5" stroke-linecap="round">
    <path d="M0 -14 a14 14 0 0 1 0 28"/>
    <path d="M12 -26 a26 26 0 0 1 0 52" opacity="0.65"/>
    <path d="M24 -38 a38 38 0 0 1 0 76" opacity="0.35"/>
  </g>

  <text x="470" y="150" font-family="SF Pro Display, -apple-system, Helvetica, Arial, sans-serif" font-size="78" font-weight="900" fill="url(#title)" letter-spacing="-1">MetaGlassHack</text>
  <text x="472" y="198" font-family="SF Pro Text, -apple-system, Helvetica, Arial, sans-serif" font-size="25" font-weight="600" fill="#9AA3C8">Seus óculos Ray-Ban Meta no Mac</text>

  <g font-family="SF Pro Text, -apple-system, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">
    <rect x="472" y="226" width="156" height="36" rx="18" fill="#5B86FF" fill-opacity="0.14" stroke="#5B86FF" stroke-opacity="0.35"/>
    <text x="550" y="250" text-anchor="middle" fill="#7FA2FF">Bluetooth</text>
    <rect x="640" y="226" width="196" height="36" rx="18" fill="#38BDF8" fill-opacity="0.14" stroke="#38BDF8" stroke-opacity="0.35"/>
    <text x="738" y="250" text-anchor="middle" fill="#38BDF8">Fone e microfone</text>
    <rect x="848" y="226" width="226" height="36" rx="18" fill="#8CF233" fill-opacity="0.14" stroke="#8CF233" stroke-opacity="0.35"/>
    <text x="961" y="250" text-anchor="middle" fill="#8CF233">Fotos e vídeos</text>
  </g>
</svg>
